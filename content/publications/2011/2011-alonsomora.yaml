abstract: >-
  This paper describes work on multi-robot pattern formation. Arbitrary target patterns are
  represented with an optimal robot deployment, using a method that is independent of the number of
  robots. Furthermore, the trajectories are visually appealing in the sense of being smooth,
  oscillation free, and showing fast convergence. A distributed controller guarantees collision free
  trajectories while taking into account the kinematics of differentially driven robots.
  Experimental results are provided for a representative set of patterns, for a swarm of up to ten
  physical robots, and for fifty virtual robots in simulation.
