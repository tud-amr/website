abstract: >-
  On-demand ridepooling systems usually need to decide which requests to serve, when the number of
  vehicles is not enough to transport them all with waiting times that are acceptable by the users.
  When doing so, they tend to provide uneven service rates, concentrating rejections in some zones
  within the operation area. In this paper, we propose two techniques that modify the objective
  function governing the assignment of users to vehicles, to prioritize requests originated at zones
  that present a relatively large rejection rate. The goal is to diminish the Gini Index of the
  rejections' rate, which is a well established way to measure inequality in economics. We test
  these techniques over an artificial small network and a real-life case in Manhattan, and we show
  that they are able to reduce the Gini Index of the rejection rates. Moreover, the overall
  rejection rate can be simultaneously reduced, thanks to utilizing the vehicles more efficiently.
