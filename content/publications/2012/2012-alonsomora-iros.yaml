abstract: >-
  This paper presents a fully automated method to display objects and animations in 3D with a group
  of aerial vehicles. The system input is a single object or an animation (sequence of objects)
  created by an artist. The first stage is to generate physical goal configurations and robot colors
  to represent the objects with the available number of robots. The run-time system includes
  algorithms for goal assignment, path planning and local reciprocal collision avoidance that
  guarantee smooth, fast and oscillation-free motion. The presented algorithms are tested in
  simulations and verified with real quadrotor helicopters and scale to large robot swarms.
