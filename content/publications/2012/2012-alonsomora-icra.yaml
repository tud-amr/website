abstract: >-
  In this paper a method for distributed reciprocal collision avoidance among multiple non-holonomic
  robots with bike kinematics is presented. The proposed algorithm, bicycle reciprocal collision
  avoidance (B-ORCA), builds on the concept of optimal reciprocal collision avoidance (ORCA) for
  holonomic robots but furthermore guarantees collision-free motions under the kinematic constraints
  of car-like vehicles. The underlying principle of the B-ORCA algorithm applies more generally to
  other kinematic models, as it combines velocity obstacles with generic tracking control. The
  theoretical results on collision avoidance are validated by several simulation experiments between
  multiple car-like robots.
