abstract: >-
  In today's digital media landscape, we are constantly surrounded by displays, from the LCDs found
  on the phones in our pockets to the ubiquitous screens that greet us whenever we enter a store,
  airport, taxicab, doctor's office, or educational institution. This plethora of displays both
  allures us and contributes to the media's saturation of our lives. The truth remains that we are
  never far from the next form of information display. Disney Research's Pixelbots takes this truth
  as an inevitability and brings the display into a kinetic form, breaking the screen out of the
  confines of a rectangular or oval experience. Billed as "Pixels with Personality," the Pixelbots'
  enticing presence rests on our ability to project human qualities onto objects that move as we do
  in physical space.
