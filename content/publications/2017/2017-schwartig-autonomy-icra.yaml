abstract: >-
  Current state-of-the-art vehicle safety systems, such as assistive braking or automatic lane
  following, are still only able to help in relatively simple driving situations. We introduce a
  Parallel Autonomy shared-control framework that produces safe trajectories based on human inputs
  even in much more complex driving scenarios, such as those commonly encountered in an urban
  setting. We minimize the deviation from the human inputs while ensuring safety via a set of
  collision avoidance constraints. We develop a receding horizon planner formulated as a Non-linear
  Model Predictive Control (NMPC) including analytic descriptions of road boundaries, and the
  configurations and future uncertainties of other traffic participants, and directly supplying them
  to the optimizer without linearization. The NMPC operates over both steering and acceleration
  simultaneously. Furthermore, the proposed receding horizon planner also applies to fully
  autonomous vehicles. We validate the proposed approach through simulations in a wide variety of
  complex driving scenarios such as left-turns across traffic, passing on busy streets, and under
  dynamic constraints in sharp turns on a race track.
