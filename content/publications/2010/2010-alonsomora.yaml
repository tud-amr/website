abstract: >-
  IIn this paper an optimalmethod for distributed collision avoidance among multiple non-holonomic
  robots is presented in theory and experiments. Non-holonomic optimal reciprocal collision
  avoidance (NH-ORCA) builds on the concepts introduced in [2], but further guarantees smooth and
  collision-free motions under non-holonomic constraints. Optimal control inputs and constraints in
  velocity space are formally derived for the non-holonomic robots. The theoretical results are
  validated in several collision avoidance experiments with up to fourteen e-puck robots set on
  collision course. Even in scenarios with very crowded situations, NH-ORCA showed to be
  collision-free for all times.
