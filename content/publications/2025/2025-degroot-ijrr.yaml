abstract: >-
  Robots will increasingly operate near humans that introduce uncertainties in the motion planning
  problem due to their complex nature. Optimization-based planners typically avoid humans through
  collision avoidance chance constraints. This allows the planner to optimize performance while
  guaranteeing probabilistic safety. However, existing real-time methods do not consider the actual
  probability of collision for the planned trajectory but rather its marginalization, that is, the
  independent collision probabilities for each planning step and/or dynamic obstacle, resulting in
  conservative trajectories.  To address this issue, we introduce a novel real-time capable method
  termed Safe Horizon MPC that explicitly constrains the joint probability of collision with all
  obstacles over the duration of the motion plan. This is achieved by reformulating the
  chance-constrained planning problem using scenario optimization and predictive control. Out of
  sampled realizations of human motion, we identify which cases affect the optimization. This allows
  us to certify the planned trajectory in real-time. Our method is less conservative than
  state-of-the-art approaches, applicable to arbitrary probability distributions of the obstacles'
  trajectories, computationally tractable and scalable. We demonstrate our proposed approach using a
  mobile robot and an autonomous vehicle in an environment shared with humans.
