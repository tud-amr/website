abstract: >-
  Multi-robot task allocation in heterogeneous systems requires efficient scheduling methods that
  can handle dynamic environments and diverse robot capabilities. This paper presents SADCHER, a
  novel attention-based approach for scheduling dynamic coalitions of heterogeneous robots in
  real-time. Our method leverages deep reinforcement learning and attention mechanisms to enable
  scalable and adaptive task assignment across robot teams with varying capabilities. The approach
  is validated through extensive simulations and demonstrates significant improvements in task
  completion rates and system efficiency compared to baseline methods.
