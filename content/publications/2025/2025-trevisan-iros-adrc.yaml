abstract: >-
  Unmanned Surface Vessels (USVs) face significant control challenges due to uncertain environmental
  disturbances like waves and currents. This paper proposes a trajectory tracking controller based
  on Active Disturbance Rejection Control (ADRC) implemented on the DUS V2500. A custom simulation
  incorporating realistic waves and current disturbances is developed to validate the controller's
  performance, supported by further validation through field tests in the harbour of Scheveningen,
  the Netherlands, and at sea. Simulation results demonstrate that ADRC significantly reduces
  cross-track error across all tested conditions compared to a baseline PID controller but increases
  control effort and energy consumption. Field trials confirm these findings while revealing a
  further increase in energy consumption during sea trials compared to the baseline.
