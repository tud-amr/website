abstract: >-
  This paper presents a formalism that exploits deformability during manipulation of soft objects by
  robot teams. A hybrid centralized/distributed approach restricts centralized planning to
  high-level global guidance of the object for consensus. Low-level control is thus delegated to the
  individual manipulator robots, which retain manipulation and collision avoidance guarantees by
  passing forces to one another through the object. A distributed receding horizon planner provides
  local control, formulated as a convex optimization problem in velocity space and incorporating
  constraints for both collision avoidance and shape maintenance. We demonstrate teams of mobile
  manipulators autonomously carrying various deformable objects.
