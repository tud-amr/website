abstract: >-
  In this paper we study the multi-robot task assignment problem with tasks that appear online and
  need to be serviced within a fixed time window in an uncertain environment. For example, when
  deployed in dynamic, human centered environments, the team of robots may not have perfect
  information about the environment. Parts of the environment may temporarily become blocked and
  blockages may only be observed on location. While numerous variants of the Canadian Traveler
  Problem describe the path planning aspect of this problem, few work has been done on multi-robot
  task allocation (MRTA) under this type of uncertainty. In this paper, we introduce and
  theoretically analyze the problem of MRTA with recoverable online blockages. Based on a stochastic
  blockage model, we compute offline tours using the expected travel costs for the online routing
  problem. The cost of the offline tours is used in a greedy task assignment algorithm. In
  simulation experiments we highlight the performance benefits of the proposed method under various
  settings.
