abstract: >-
  Autonomous mobile robots navigating among humans must not only consider safety and efficiency but
  also move acceptably in the current social context. A hybrid deep reinforcement learning - model
  predictive control (DRL-MPC) approach can account for the complex interactions among humans while
  maintaining the collision avoidance guarantees and feasibility constraints inherent in the MPC
  formulation. However, encoding socially acceptable behavior through a reward or cost function,
  along with other objectives such as reaching the goal quickly, is challenging. Therefore, this
  work proposes a new training strategy that combines supervised and reinforcement learning to
  exploit human demonstration. Furthermore, it presents first results from real-world experiments.
