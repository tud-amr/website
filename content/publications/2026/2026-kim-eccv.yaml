abstract: >-
  Dense 3D semantic occupancy perception is critical for mobile robots operating in pedestrian-rich
  environments, yet it remains underexplored compared to its application in autonomous driving. To
  address this gap, we present MobileOcc, a semantic occupancy dataset for mobile robots operating
  in crowded human environments. Our dataset is built using an annotation pipeline that incorporates
  static object occupancy annotations and a novel mesh optimization framework explicitly designed
  for human occupancy modeling. It reconstructs deformable human geometry from 2D images and
  subsequently refines and optimizes it using associated LiDAR point data. Using MobileOcc, we
  establish benchmarks for two tasks: i) occupancy prediction and ii) pedestrian velocity
  prediction, using different methods, including monocular, stereo, and panoptic occupancy, with
  metrics and baseline implementations for reproducible comparison. Beyond occupancy prediction, we
  further assess our annotation method on 3D human pose estimation datasets, where results
  demonstrate robust performance across different datasets.
