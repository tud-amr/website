abstract: >-
  This paper presents a distributed method for splitting and merging of multi-robot formations in
  dynamic environments with static and moving obstacles. Splitting and merging actions rely on
  distributed consensus and can be performed to avoid obstacles. Our method accounts for the limited
  communication range and visibility radius of the robots and relies on the communication of
  obstacle-free convex regions and the computation of an intersection graph. In addition, our method
  is able to detect and recover from (permanent and temporary) communication and motion faults.
  Finally, we demonstrate the applicability and scalability of the proposed method in simulations
  with up to sixteen quadrotors and real-world experiments with a team of four quadrotors.
