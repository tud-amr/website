abstract: >-
  Mobile manipulators are susceptible to situations in which the precomputed grasp pose is not
  reachable as the result of conflicts between collision avoidance behaviour and the manipulation
  task. In this work, we address this issue by combining real-time grasp planning with geometric
  motion planning for decentralized multi-agent systems, referred to as Reactive Grasp Fabrics
  (RGF). We optimize the precomputed grasp pose candidate to account for obstacles and the robot's
  kinematics. By leveraging a reactive geometric motion planner, specifically geometric fabrics, the
  grasp optimization problem can be simplified, resulting in a fast, adaptive framework that can
  resolve deadlock situations in pick-and-place tasks. We demonstrate the robustness of this
  approach by controlling a mobile manipulator in both simulation and real-world experiments in
  dynamic environments.
