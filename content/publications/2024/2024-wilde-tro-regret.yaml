abstract: >-
  Many problems in robotics seek to simultaneously optimize several competing objectives. A
  conventional approach is to create a single cost function comprised of the weighted sum of the
  individual objectives. Solutions to this scalarized optimization problem are Pareto optimal
  solutions to the original multiobjective problem. However, finding an accurate representation of a
  Pareto front remains an important challenge. Uniformly spaced weights are often inefficient and do
  not provide error bounds. We address the problem of computing a finite set of weights whose
  optimal solutions closely approximate the solution of any other weight vector. To this end, we
  prove fundamental properties of the optimal cost as a function of the weight vector. We propose an
  algorithm that greedily adds the weight vector least-represented by the current set, and provide
  bounds on the regret. We extend our method to include suboptimal solvers for the scalarized
  optimization, and handle stochastic inputs to the planning problem. Finally, we illustrate that
  the proposed approach significantly outperforms baseline approaches for different robot planning
  problems with varying numbers of objective functions.
