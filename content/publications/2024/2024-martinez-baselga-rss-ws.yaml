abstract: >-
  Navigating mobile robots in social environments remains a challenging task due to the intricacies
  of human-robot interactions. Most of the motion planners designed for crowded and dynamic
  environments focus on reaching the goal while avoiding collisions or local social interactions,
  but do not explicitly consider the high-level navigation behavior (avoiding through the left or
  right side, letting others pass or passing before others, etc.). In this work, we present a novel
  motion planner that incorporates topology distinct paths representing diverse navigation
  strategies around humans. The planner uses a deep neural network model trained on real-world human
  motion data to estimate how well a topology classes imitate the human behavior. Then, selects the
  best topology class using it, ensuring socially intelligent and contextually aware navigation. Our
  system refines the chosen path through an optimization-based local planner in real time, ensuring
  adherence to desired social behaviors. We evaluate the prediction accuracy of the network with
  real-world data and the navigation capabilities in both simulation and a realworld platform. Our
  method demonstrates socially desirable behaviors, smooth and remarkable performance compared to
  other planners.
