abstract: >-
  Using the language of dynamical systems, Imitation learning (IL) provides an intuitive and
  effective way of teaching stable task-space motions to robots with goal convergence. Yet, these
  techniques are affected by serious limitations when it comes to ensuring safety and fulfillment of
  physical constraints. With this work, we propose to solve this challenge via TamedPUMA, an IL
  algorithm augmented with a recent development in motion planning called geometric fabrics. We
  explore two variations of this approach, which we name the forcing policy method and the
  compatible potential method. Making these combinations possible requires two enabling factors: the
  possibility of learning second-order dynamical systems by imitation and the availability of a
  potential function that is compatible with the learned dynamics. In this paper, we show how these
  conditions can be met when using an IL strategy called PUMA. The result is a stable imitation
  learning strategy within which we can seamlessly blend geometrical constraints like collision
  avoidance and joint limits. Beyond providing a theoretical analysis, we demonstrate TamedPUMA with
  simulated and real-world tasks, including a 7-degree-of-freedom manipulator that is trained to
  pick a tomato from a crate in the presence of obstacles.
