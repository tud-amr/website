abstract: >-
  For an autonomous vehicle to operate reliably within real-world traffic scenarios, it is
  imperative to assess the repercussions of its prospective actions by anticipating the uncertain
  intentions exhibited by other participants in the traffic environment. Driven by the pronounced
  multi-modal nature of human driving behavior, this paper presents an approach that leverages
  Bayesian beliefs over the distribution of potential policies of other road users to construct a
  novel risk-aware probabilistic motion planning framework. In particular, we propose a novel
  contingency planner that outputs long-term contingent plans conditioned on multiple possible
  intents for other actors in the traffic scene. The Bayesian belief is incorporated into the
  optimization cost function to influence the behavior of the short-term plan based on the
  likelihood of other agents' policies. Furthermore, a probabilistic risk metric is employed to
  fine-tune the balance between efficiency and robustness. Through a series of closed-loop
  safety-critical simulated traffic scenarios shared with human-driven vehicles, we demonstrate the
  practical efficacy of our proposed approach that can handle multi-vehicle scenarios.
