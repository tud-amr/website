abstract: >-
  This paper proposes a decentralized trajectory planning framework for the collision avoidance
  problem of mul- tiple micro aerial vehicles (MAVs) in environments with static and dynamic
  obstacles. The framework utilizes spatiotemporal occupancy grid maps (SOGM), which forecast the
  occupancy status of neighboring space in the near future, as the environ- ment representation.
  Based on this representation, we extend the kinodynamic A* and the corridor-constrained trajectory
  optimization algorithms to efficiently tackle static and dynamic obstacles with arbitrary shapes.
  Collision avoidance between communicating robots is integrated by sharing planned tra- jectories
  and projecting them onto the SOGM. The simulation results show that our method achieves
  competitive performance against state-of-the-art methods in dynamic environments with different
  numbers and shapes of obstacles. Finally, the proposed method is validated in real experiments.
