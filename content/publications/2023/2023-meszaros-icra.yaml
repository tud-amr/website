abstract: >-
  Predicting the future behaviour of people re- mains an open challenge for the development of
  risk-aware autonomous vehicles. An important aspect of this challenge is effectively capturing the
  uncertainty inherent to human behaviour. This paper studies an approach for multi-modal
  probabilistic motion forecasting of an agent with improved accuracy in the predicted sample
  likelihoods. Our approach achieves state-of-the-art results on the inD dataset when evalu- ated
  with the standard metrics employed for motion forecasting. Furthermore, our approach also achieves
  state-of-the-art results when evaluated with respect to the likelihoods it assigns to its
  generated trajectories. Evaluations on artificial datasets indicate that the distributions learned
  by our model closely correspond to the true distributions observed in data and are not as prone to
  being over-confident in a single outcome in the face of uncertainty.
