abstract: >-
  Navigating mobile robots through environments shared with humans is challenging. From the
  perspective of the robot, humans are dynamic obstacles that must be avoided. These obstacles make
  the collision-free space nonconvex, which leads to two distinct passing behaviors per obstacle
  (passing left or right). For local planners, such as receding-horizon trajectory optimization,
  each behavior presents a local optimum in which the planner can get stuck. This may result in slow
  or unsafe motion even when a better plan exists. In this work, we identify trajectories for
  multiple locally optimal driving behaviors, by considering their topology. This identification is
  made consistent over successive iterations by propagating the topology information. The most
  suitable high-level trajectory guides a local optimization-based planner, resulting in fast and
  safe motion plans. We validate the proposed planner on a mobile robot in simulation and real-world
  experiments.
