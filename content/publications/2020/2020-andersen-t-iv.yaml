abstract: >-
  In this article we present a trajectory generation method for autonomous overtaking of unexpected
  obstacles in a dynamic urban environment. In these settings, blind spots can arise from perception
  limitations. For example when overtaking unexpected objects on the vehicle's ego lane on a two-way
  street. In this case, a human driver would first make sure that the opposite lane is free and that
  there is enough room to successfully execute the maneuver, and then it would cut into the opposite
  lane in order to execute the maneuver successfully. We consider the practical problem of
  autonomous overtaking when the coverage of the perception system is impaired due to occlusion.
  Safe trajectories are generated by solving, in real-time, a non-linear constrained optimization,
  formulated as a receding horizon planner that maximizes the ego vehicle's visibility. The planner
  is complemented by a high-level behavior planner, which takes into account the occupancy of other
  traffic participants, the information from the vehicle's perception system, and the risk
  associated with the overtaking maneuver, to determine when the overtake maneuver should happen.
  The approach is validated in simulation and in experiments in real world traffic.
