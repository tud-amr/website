abstract: >-
  Real-time interaction with a group of robots is shown with a hand-held tablet, which tracks the
  robots and computes collision-free trajectories. Efficient algorithms are described and
  experiments are performed in scenarios with changing illumination. Augmented reality and a
  multi-player setup are also described.
