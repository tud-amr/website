{%- assign d = project.data -%}
<article class="tile tile-link">
  <img class="tile-media" src="{{ d.image }}" alt="" width="267" height="230">
  <div class="tile-body">
    <h3 class="tile-title"><a href="{{ project.url }}">{{ d.title }}</a></h3>
    <p class="tile-meta">{{ d.date | date: "%B %Y" }}{% if d.end_date %} – {{ d.end_date | date: "%B %Y" }} | Finished{% endif %}</p>
    <p class="tile-meta"><strong>Funding:</strong> {{ d.fundings }}</p>
    <p class="tile-text">{{ d.description }}</p>
    <span class="tile-more">Continue reading <i class="bi bi-arrow-right" aria-hidden="true"></i></span>
  </div>
</article>
