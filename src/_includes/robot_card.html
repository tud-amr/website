{%- assign d = include.robot.data -%}
<article class="tile">
  {%- if d.image contains '.mp4' %}
  <video class="tile-media" src="{% include fix_link.html link=d.image %}" muted autoplay loop playsinline aria-label="Video of {{ d.name }}"></video>
  {%- else %}
  <img class="tile-media" src="{% include fix_link.html link=d.image %}" alt="{{ d.name }}">
  {%- endif %}
  <div class="tile-body">
    <h3 class="tile-title">{{ d.name }}</h3>
    <p class="tile-meta">{{ d.subtitle }}</p>
    <div class="tile-text">{{ include.robot.content }}</div>
  </div>
</article>
